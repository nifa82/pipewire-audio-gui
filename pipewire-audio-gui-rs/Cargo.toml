[package]
name = "pipewire-audio-gui"
version = "1.1.0"
edition = "2021"
description = "GTK4 GUI for PipeWire sample rate and bit depth settings on openSUSE"
license = "MIT"
authors = ["nifa"]
repository = "https://github.com/nifa/pipewire-audio-gui"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
glib = { version = "0.19", features = ["v2_78"] }
gio = { version = "0.19", features = ["v2_78"] }
adw = { version = "0.6", features = ["v1_4"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"
regex = "1.10"
url = "2.5"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
strip = true