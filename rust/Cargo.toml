[package]
name = "pipewire-audio-gui"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "Change PipeWire sample rate and bit depth on Linux desktops"
license = "MIT"
readme = "README.md"

[[bin]]
name = "pipewire-audio-gui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = "0.3"
base64 = "0.23"

[profile.release]
opt-level = 2
lto = "thin"
strip = true